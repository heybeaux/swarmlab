name: exp65-evidence
on:
  pull_request:
  push:
    branches: [main]
jobs:
  replay-and-real-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: experiments/64-merged-rule-ownership/ci/package-lock.json
      - name: Portable core/experiment toolchain (old file deps untouched)
        run: |
          npm ci --prefix experiments/64-merged-rule-ownership/ci --workspaces=false
          ln -s experiments/64-merged-rule-ownership/ci/node_modules node_modules
          mkdir -p node_modules/@swarmlab
          ln -s "$GITHUB_WORKSPACE/core" node_modules/@swarmlab/core
          node_modules/.bin/tsc -b core experiments/65-loaded-rule-ownership
          node_modules/.bin/tsc -b --force core experiments/65-loaded-rule-ownership
      - name: Verify admitted corpus plus exact red-red-green receipts
        run: npm run verify:evidence && node experiments/65-loaded-rule-ownership/verify-receipts.mjs
      - name: Checkout exact Aegis candidate
        uses: actions/checkout@v4
        with:
          repository: heybeaux/aegis
          ref: 1831c858da1583ac9e6ecbc323942caa2bf2c84b
          path: .aegis-exp65
      - name: Build real package
        working-directory: .aegis-exp65
        run: pnpm install --frozen-lockfile && pnpm --filter @heybeaux/lattice-aegis build
      - name: Same frozen design against real Aegis; inspect full rows and actual source/dist
        run: |
          START="$(node -e 'console.log(Date.now())')"
          AEGIS_REPO="$GITHUB_WORKSPACE/.aegis-exp65" node experiments/65-loaded-rule-ownership/dist/main.js > "$RUNNER_TEMP/exp65.log"
          cat "$RUNNER_TEMP/exp65.log"
          node experiments/65-loaded-rule-ownership/verify-receipts.mjs --run "$RUNNER_TEMP/exp65.log" --since "$START"
          node experiments/65-loaded-rule-ownership/test-verifier.mjs "$RUNNER_TEMP/exp65.log"
