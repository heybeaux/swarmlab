name: exp68-evidence
on:
  pull_request:
  push:
    branches: [main]
jobs:
  replay-and-real-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable core toolchain (legacy file dependencies untouched)
        run: |
          npm ci --prefix experiments/64-merged-rule-ownership/ci --workspaces=false
          ln -s experiments/64-merged-rule-ownership/ci/node_modules node_modules
          mkdir -p node_modules/@swarmlab
          ln -s "$GITHUB_WORKSPACE/core" node_modules/@swarmlab/core
          node_modules/.bin/tsc -b core
          node_modules/.bin/tsc -b --force core
          for f in experiments/68-cumulative-regex-work/*.mjs; do node --check "$f"; done
      - name: Verify admitted evidence and recomputed red-red-green receipts
        run: npm run verify:evidence && node experiments/68-cumulative-regex-work/verify-receipts.mjs
      - uses: actions/checkout@v4
        with:
          repository: heybeaux/aegis
          ref: fb842ea66be1666ca771195b5923c2bdcb096aa0
          path: .aegis-exp68
      - name: Build actual pinned package
        working-directory: .aegis-exp68
        run: pnpm install --frozen-lockfile && pnpm --filter @heybeaux/lattice-aegis build
      - name: Frozen design against actual artifact, fresh typed outcomes not exit0
        run: |
          START="$(node -e 'console.log(Date.now())')"
          AEGIS_REPO="$GITHUB_WORKSPACE/.aegis-exp68" node experiments/68-cumulative-regex-work/main.mjs > "$RUNNER_TEMP/exp68.log"
          cat "$RUNNER_TEMP/exp68.log"
          node experiments/68-cumulative-regex-work/verify-receipts.mjs --run "$RUNNER_TEMP/exp68.log" --since "$START" --sha "fb842ea66be1666ca771195b5923c2bdcb096aa0"
          node experiments/68-cumulative-regex-work/test-verifier.mjs "$RUNNER_TEMP/exp68.log"
