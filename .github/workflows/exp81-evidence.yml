name: exp81-evidence
on:
  pull_request:
  push:
    branches: [main]
jobs:
  replay-and-real-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable core toolchain (legacy file dependencies untouched)
        run: |
          npm ci --prefix experiments/64-merged-rule-ownership/ci --workspaces=false
          ln -s experiments/64-merged-rule-ownership/ci/node_modules node_modules
          mkdir -p node_modules/@swarmlab
          ln -s "$GITHUB_WORKSPACE/core" node_modules/@swarmlab/core
          node_modules/.bin/tsc -b core
          node_modules/.bin/tsc -b --force core
          for f in experiments/81-resume-start-integrity/*.mjs; do node --check "$f"; done
      - name: Verify admitted evidence and recomputed red-red-green receipts
        run: npm run verify:evidence && node experiments/81-resume-start-integrity/verify-receipts.mjs
      - uses: actions/checkout@v4
        with:
          repository: heybeaux/aegis
          ref: 1ec252873f2a7127a71b6843f6efe6cab28a180b
          path: .aegis-exp81
      - name: Build actual pinned package
        working-directory: .aegis-exp81
        run: pnpm install --frozen-lockfile && pnpm --filter @heybeaux/lattice-aegis build && pnpm --filter @heybeaux/aegis-collect build && pnpm --filter @heybeaux/aegis-hook build
      - name: Frozen design against actual artifact, fresh typed outcomes not exit0
        run: |
          START="$(node -e 'console.log(Date.now())')"
          AEGIS_REPO="$GITHUB_WORKSPACE/.aegis-exp81" node experiments/81-resume-start-integrity/main.mjs > "$RUNNER_TEMP/exp81.log"
          cat "$RUNNER_TEMP/exp81.log"
          node experiments/81-resume-start-integrity/verify-receipts.mjs --run "$RUNNER_TEMP/exp81.log" --since "$START" --sha "1ec252873f2a7127a71b6843f6efe6cab28a180b" --repo "$GITHUB_WORKSPACE/.aegis-exp81"
          node experiments/81-resume-start-integrity/test-verifier.mjs
