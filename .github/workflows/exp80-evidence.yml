name: exp80-evidence
on:
  pull_request:
  push:
    branches: [main]
jobs:
  replay-and-real-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable core toolchain (legacy file dependencies untouched)
        run: |
          npm ci --prefix experiments/64-merged-rule-ownership/ci --workspaces=false
          ln -s experiments/64-merged-rule-ownership/ci/node_modules node_modules
          mkdir -p node_modules/@swarmlab
          ln -s "$GITHUB_WORKSPACE/core" node_modules/@swarmlab/core
          node_modules/.bin/tsc -b core
          node_modules/.bin/tsc -b --force core
          for f in experiments/80-strict-issuance-journal/*.mjs; do node --check "$f"; done
      - name: Verify admitted evidence and recomputed red-red-green receipts
        run: npm run verify:evidence && node experiments/80-strict-issuance-journal/verify-receipts.mjs
      - uses: actions/checkout@v4
        with:
          repository: heybeaux/aegis
          ref: 67b57ac7871347119973aee1da24f155716a979e
          path: .aegis-exp80
      - name: Build actual pinned package
        working-directory: .aegis-exp80
        run: pnpm install --frozen-lockfile && pnpm --filter @heybeaux/lattice-aegis build && pnpm --filter @heybeaux/aegis-collect build && pnpm --filter @heybeaux/aegis-hook build
      - name: Frozen design against actual artifact, fresh typed outcomes not exit0
        run: |
          START="$(node -e 'console.log(Date.now())')"
          AEGIS_REPO="$GITHUB_WORKSPACE/.aegis-exp80" node experiments/80-strict-issuance-journal/main.mjs > "$RUNNER_TEMP/exp80.log"
          cat "$RUNNER_TEMP/exp80.log"
          node experiments/80-strict-issuance-journal/verify-receipts.mjs --run "$RUNNER_TEMP/exp80.log" --since "$START" --sha "67b57ac7871347119973aee1da24f155716a979e" --repo "$GITHUB_WORKSPACE/.aegis-exp80"
          node experiments/80-strict-issuance-journal/test-verifier.mjs
