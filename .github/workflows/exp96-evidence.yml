name: exp96-evidence
on:
  pull_request:
  push:
    branches: [main]
jobs:
  replay-and-real-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable core toolchain
        run: |
          npm ci --prefix experiments/64-merged-rule-ownership/ci --workspaces=false
          ln -s experiments/64-merged-rule-ownership/ci/node_modules node_modules
          mkdir -p node_modules/@swarmlab
          ln -s "$GITHUB_WORKSPACE/core" node_modules/@swarmlab/core
          node_modules/.bin/tsc -b --force core
          for f in experiments/96-burn-ack-type-integrity/*.mjs; do node --check "$f"; done
      - name: Recompute admitted evidence and reject tampering
        run: |
          npm run verify:evidence
          node experiments/96-burn-ack-type-integrity/verify-receipts.mjs
          node experiments/96-burn-ack-type-integrity/test-verifier.mjs
      - uses: actions/checkout@v4
        with:
          repository: heybeaux/aegis
          ref: a0881abc031d0b1f5955f570c05d534b1eb86146
          path: .aegis-exp96
      - name: Build actual pinned Aegis hook and dependencies
        working-directory: .aegis-exp96
        run: pnpm install --frozen-lockfile && pnpm --filter @heybeaux/aegis-hook... build
      - name: Same frozen experiment against real artifacts
        run: |
          START="$(node -e 'console.log(Date.now())')"
          AEGIS_REPO="$GITHUB_WORKSPACE/.aegis-exp96" node experiments/96-burn-ack-type-integrity/main.mjs > "$RUNNER_TEMP/exp96.json"
          cat "$RUNNER_TEMP/exp96.json"
          node experiments/96-burn-ack-type-integrity/verify-receipts.mjs --run "$RUNNER_TEMP/exp96.json" --since "$START" --sha a0881abc031d0b1f5955f570c05d534b1eb86146 --repo "$GITHUB_WORKSPACE/.aegis-exp96"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp96-fresh-evidence
          path: |
            experiments/96-burn-ack-type-integrity/runs/
            ${{ runner.temp }}/exp96.json
