name: exp94-evidence
on:
  pull_request:
  push:
    branches: [main]
jobs:
  replay-and-real-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable core toolchain
        run: |
          npm ci --prefix experiments/64-merged-rule-ownership/ci --workspaces=false
          ln -s experiments/64-merged-rule-ownership/ci/node_modules node_modules
          mkdir -p node_modules/@swarmlab
          ln -s "$GITHUB_WORKSPACE/core" node_modules/@swarmlab/core
          node_modules/.bin/tsc -b --force core
          for f in experiments/94-execution-authority-lease/*.mjs; do node --check "$f"; done
      - name: Recompute admitted evidence and reject tampering
        run: |
          npm run verify:evidence
          node experiments/94-execution-authority-lease/verify-receipts.mjs
          node experiments/94-execution-authority-lease/test-verifier.mjs
      - uses: actions/checkout@v4
        with:
          repository: heybeaux/aegis
          ref: 33322aa6e30e7c74a3b13da90c6409bcc56aded3
          path: .aegis-exp94
      - name: Build actual pinned Aegis hook and dependencies
        working-directory: .aegis-exp94
        run: pnpm install --frozen-lockfile && pnpm --filter @heybeaux/aegis-hook... build
      - name: Same frozen experiment against real artifacts
        run: |
          START="$(node -e 'console.log(Date.now())')"
          AEGIS_REPO="$GITHUB_WORKSPACE/.aegis-exp94" node experiments/94-execution-authority-lease/main.mjs > "$RUNNER_TEMP/exp94.json"
          cat "$RUNNER_TEMP/exp94.json"
          node experiments/94-execution-authority-lease/verify-receipts.mjs --run "$RUNNER_TEMP/exp94.json" --since "$START" --sha 33322aa6e30e7c74a3b13da90c6409bcc56aded3 --repo "$GITHUB_WORKSPACE/.aegis-exp94"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp94-fresh-evidence
          path: |
            experiments/94-execution-authority-lease/runs/
            ${{ runner.temp }}/exp94.json
